</style></head><body><div id="root"></div><script>
const brand=`<a class="logo" href="?view=home"><span class="mark"><i></i><i></i><i></i><i></i></span>Te Aviso</a>`;
const paths={bell:'M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9 M10 21h4',users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M16 3a4 4 0 0 1 0 8 M22 21v-2a4 4 0 0 0-3-4 M13 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0',calendar:'M8 2v4 M16 2v4 M3 10h18 M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2 M7 14h3 M14 14h3 M7 18h3',user:'M20 21a8 8 0 0 0-16 0 M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0',box:'M3 6l9-4 9 4v12l-9 4-9-4z M3 6l9 5 9-5 M12 11v11 M7 4l10 5',phone:'M5 3H2c0 11 8 19 19 19v-3l-5-3-3 3a16 16 0 0 1-8-8l3-3z'};
const icon=name=>`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="${paths[name]||paths.bell}"/></svg>`;
const header=()=>`<header class="app-header">${brand}<button class="round" aria-label="Mi cuenta">AT</button></header>`;
const nav=active=>`<nav class="nav-bottom">${[['Timbres','bell','home'],['Visitas','users','visitor'],['Agenda','calendar','agenda'],['Cuenta','user','messages']].map(([label,ic,v])=>`<a class="${active===label?'active':''}" href="?view=${v}">${icon(ic)}${label}</a>`).join('')}</nav>`;
const photo='cartel-instalado.png';
const week=()=>`<div class="week">${['Lun|26','Mar|27','Mié|28','Jue|29','Vie|30','Sáb|31','Dom|1'].map((v,i)=>`<button class="day ${i===1?'active':''}" onclick="selectDay(this)">${v.split('|')[0]}<b>${v.split('|')[1]}</b></button>`).join('')}</div>`;
const agenda=()=>`${header()}<main class="app-body"><div class="eyebrow">Consultorio</div><h1>Mi agenda</h1><p class="sub">Turnos y disponibilidad</p><div class="selector"><span>Consultorio · San Martín 1234</span><span>⌄</span></div><div class="bar"><button aria-label="Anterior">‹</button><strong>Octubre 2026</strong><button aria-label="Siguiente">›</button></div>${week()}<div class="segmented"><button class="on">Día</button><button>Semana</button><button>Lista</button></div><div class="appointments"><article class="appointment"><time>09:00</time><div><strong>Lucía Torres</strong><p>Consulta · 30 min</p><span class="status">Confirmado</span></div></article><article class="appointment"><time>11:00</time><div><strong>Juan Pérez</strong><p>Control · 30 min</p><span class="status pending">Pendiente</span></div></article><article class="appointment blocked"><time>15:30</time><div><strong>Horario bloqueado</strong><p>No recibe reservas</p></div></article></div><button class="btn light full" style="margin-top:20px" onclick="toast('Ejemplo de configuración de horarios')">Configurar horarios</button></main>${nav('Agenda')}`;

const messages=()=>`${header()}<main class="app-body"><div class="eyebrow">Configuración del timbre</div><h1>Mensajes precargados</h1><p class="sub">Los botones que verá la visita.</p><div class="selector"><span>Puerta principal</span><span>⌄</span></div><div class="reason-edit-list"><div class="reason-edit"><span>Entrega</span><button>Editar</button></div><div class="reason-edit"><span>Llegué a mi turno</span><button>Editar</button></div><div class="reason-edit"><span>Visita</span><button>Editar</button></div></div><form class="edit-card" onsubmit="event.preventDefault();toast('Cambios de ejemplo guardados en esta maqueta')"><h2>Editar mensaje</h2><label class="field">Nombre del botón<input value="Entrega" required></label><label class="field">Mensaje<textarea required>Estoy en la entrada con una entrega.</textarea></label><button class="btn full" type="submit" style="margin-top:17px">Guardar mensaje</button></form><button class="btn quiet" style="font-size:12px;margin-top:10px" onclick="toast('Ejemplo de un nuevo mensaje')">+ Agregar mensaje</button></main>${nav('Visitas')}`;
const home=()=>`<div class="wrap"><header class="top">${brand}<nav class="links"><a href="#funciones">Cómo funciona</a><a href="#carteles">Carteles</a><a href="#planes">Planes</a><a class="btn light" href="?view=agenda">Ingresar</a></nav></header><main><section class="hero"><div><div class="eyebrow">Timbre digital</div><h1>Tu timbre,<br>en un QR.</h1><p>Escanean en tu puerta y te avisan al celular.</p><div class="actions"><a class="btn" href="?view=visitor">Crear mi timbre</a><a class="text-link" href="#carteles">Elegir un cartel</a></div></div><div><img class="hero-photo" src="${photo}" alt="Visualización fotográfica de una placa vertical instalada"><p class="hero-note">Dirección + timbre · Formato vertical compacto</p></div></section><div class="steps"><div class="step"><span>01</span>Creá tu timbre</div><div class="step"><span>02</span>Colocá el QR</div><div class="step"><span>03</span>Recibí visitas</div></div><section class="section" id="funciones"><div class="section-head"><div><h2>Así funciona Te Aviso</h2><p>Agenda, llamadas y mensajes, desde tu panel.</p></div></div><div class="features"><article class="feature"><h3>Organizá tus turnos</h3><div class="mini"><div class="mini-title"><b>Martes, 27 de octubre</b><span>Día</span></div><div class="mini-row"><b>09:00</b><span>Lucía Torres · Consulta</span><em>Confirmado</em></div><div class="mini-row"><b>11:00</b><span>Juan Pérez · Control</span><em style="color:#8e732b">Pendiente</em></div></div><p>Horarios, reservas y disponibilidad.</p><a class="text-link" href="?view=agenda" style="display:inline-block;margin-top:10px">Ver la agenda →</a></article><article class="feature"><h3>Atendé tu timbre</h3><div class="mini"><div class="mini-title"><b>Llamada entrante</b><span>Audio</span></div><div style="padding-top:9px"><b>Puerta principal</b><p style="margin:3px 0 8px;font-size:10px">Motivo indicado: Entrega</p><div style="display:flex;gap:8px"><button class="btn red" style="min-height:25px;padding:5px 10px;font-size:9px">Rechazar</button><button class="btn green" style="min-height:25px;padding:5px 10px;font-size:9px">Atender</button></div></div></div><p>Elegís cuándo responder a tus visitas.</p><a class="text-link" href="?view=call" style="display:inline-block;margin-top:10px">Ver una llamada →</a></article><article class="feature"><h3>Sabé por qué llegaron</h3><div class="mini"><div style="display:flex;gap:5px"><span class="chip selected">Entrega</span><span class="chip">Turno</span><span class="chip">Visita</span></div><div class="mini-msg">Estoy en la entrada<br>con una entrega.</div></div><p>Mensajes que podés personalizar.</p><a class="text-link" href="?view=messages" style="display:inline-block;margin-top:10px">Ver los mensajes →</a></article></div><p class="small-note">Funciones disponibles según el plan.</p></section><section class="section" id="carteles"><div class="section-head"><div><h2>Un cartel para tu entrada</h2><p>Acrílico o aluminio, con tus datos y tu QR.</p></div></div><div class="products">${[['01','Timbre QR','Una placa compacta para pegar.'],['02','Dirección + timbre','Vertical compacto · 12 × 18 cm.'],['03','Profesional + timbre','Nombre, matrícula y datos del consultorio.']].map(([n,t,d])=>`<article class="product"><span class="number">${n}</span><h3>${t}</h3><small>${d}</small><button class="btn light" onclick="toast('Vista previa: personalización del cartel')">Ver opciones →</button></article>`).join('')}</div><p class="small-note">El cartel se compra por separado del plan digital. También podés imprimir tu QR.</p></section><section class="section" id="planes"><div class="section-head"><h2>Elegí según tu espacio</h2><a class="text-link" href="?view=visitor">Consultar planes →</a></div><div class="plans"><article class="plan"><h3>Personal</h3><p>QR WhatsApp básico. Adicionales de pago.</p></article><article class="plan"><h3>Negocio</h3><p>Horarios, reservas y atención.</p></article><article class="plan"><h3>Edificio</h3><p>Unidades y asistencia.</p></article></div></section></main><footer class="site-footer">${brand}<div class="links"><a href="#">Ayuda</a><a href="#">Privacidad</a><a href="?view=agenda">Ingresar</a></div></footer></div>`;
const view=new URLSearchParams(location.search).get('view')||'home';const pages={home,agenda,call,visitor,messages};document.body.className=view==='home'?'home':'mobile';document.getElementById('root').innerHTML=(pages[view]||home)();
function toast(text){document.querySelector('.app-toast')?.remove();const el=document.createElement('div');el.className='app-toast';el.textContent=text;document.body.append(el);setTimeout(()=>el.remove(),3500)}
function selectDay(el){document.querySelectorAll('.day').forEach(b=>b.classList.remove('active'));el.classList.add('active')}
function chooseReason(el,reason){document.querySelectorAll('.reason').forEach(b=>b.classList.remove('active'));el.classList.add('active');document.getElementById('message').textContent=({Entrega:'Estoy en la entrada con una entrega.','Llegué a mi turno':'Hola, ya llegué para mi turno.',Visita:'Hola, estoy en la entrada. ¿Podés atenderme?'})[reason]}
document.querySelectorAll('.segmented button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.segmented button').forEach(s=>s.classList.remove('on'));b.classList.add('on')});
</script></body></html>
