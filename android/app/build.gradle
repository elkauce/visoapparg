apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// The official Home SDK is supplied from the user's existing STATUS project.
// Keep the standalone SDK outside the public repository. CI without it builds
// an explicitly unavailable bridge, rather than pretending that Home is linked.
def homeSdkPath = System.getenv('VISO_GOOGLE_HOME_SDK_DIR')
def homeSdkFiles = homeSdkPath ? [
    new File(homeSdkPath, 'play-services-home-17.1.0.aar'),
    new File(homeSdkPath, 'play-services-home-types-17.1.0.aar')
] : []
if (homeSdkPath) {
    def expected = [
        'dd088a22a0fc16886ee8a81bb86db9efc254378cf68b5cf4d59c5a7c1405b02b',
        '4eda000761e067ec5b009a1b2cf6fce67f32dbf15628d1dcf8846db58f303003'
    ]
    homeSdkFiles.eachWithIndex { sdk, index ->
        if (!sdk.isFile()) throw new GradleException('The configured official Google Home SDK is incomplete.')
        def sha = java.security.MessageDigest.getInstance('SHA-256').digest(sdk.bytes).encodeHex().toString()
        if (sha != expected[index]) throw new GradleException('The configured Google Home SDK does not match the reviewed STATUS distribution.')
    }
}
def hasHomeSdk = !homeSdkFiles.isEmpty()

android {
    namespace = "com.viso.deck"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.viso.deck"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    sourceSets {
        main.java.srcDirs += ['src/googleHome/shared', hasHomeSdk ? 'src/googleHome/java' : 'src/googleHomeUnavailable/java']
    }
    // Signing material is supplied by the release operator, never committed.
    def releaseStore = System.getenv('VISO_RELEASE_STORE_FILE')
    if (releaseStore) {
        signingConfigs {
            release {
                storeFile file(releaseStore)
                storePassword System.getenv('VISO_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('VISO_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('VISO_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        localTest {
            initWith debug
            matchingFallbacks = ['debug']
        }
        release {
            if (releaseStore) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    if (hasHomeSdk) {
        implementation files(homeSdkFiles)
        // Dependencies of the reviewed STATUS/viso-safe SDK integration.
        implementation 'com.google.android.gms:play-services-auth:21.6.0'
        implementation 'com.google.android.gms:play-services-auth-base:18.0.10'
        implementation 'com.google.android.gms:play-services-base:18.5.0'
        implementation 'com.google.android.gms:play-services-basement:18.9.0'
        implementation 'com.google.android.gms:play-services-tasks:18.2.0'
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
